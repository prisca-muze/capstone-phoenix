---
- name: Join worker nodes to the k3s cluster
  hosts: agents
  become: true
  tasks:
    - name: Fetch k3s join token from control-plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      delegate_to: control_plane
      run_once: true

    - name: Install k3s agent and join cluster
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL="https://{{ hostvars['control_plane']['private_ip'] }}:6443" \
        K3S_TOKEN="{{ k3s_token['content'] | b64decode | trim }}" \
        sh -
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh
