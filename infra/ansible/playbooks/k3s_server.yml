---
- name: Install k3s on the control-plane node
  hosts: server
  become: true
  tasks:
    - name: Install k3s server with --flannel-backend=none and TLS SAN
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --flannel-backend=none --cluster-init --tls-san={{ hostvars['control_plane']['ansible_host'] }}" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      retries: 10
      delay: 10
      register: result
      until: result.rc == 0
